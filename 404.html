<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0a0a0b">

<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jura:wght@300;400;500;600;700&family=Manrope:wght@300;400;500&display=swap"></noscript>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0b;--white:#f4f2ee;--muted:#a3a099;--red:#e0122b;--red-deep:#9c0b1e;
  --line:rgba(244,242,238,.1);--ease:cubic-bezier(.2,.7,.2,1)}
body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:40px 22px;background:var(--bg);color:var(--white);font-family:"Manrope",system-ui,sans-serif;
  background-image:radial-gradient(900px 600px at 70% 10%,rgba(224,18,43,.12),transparent 60%)}
.box{width:100%;max-width:560px;text-align:center}
.code{font-family:"Jura",sans-serif;font-weight:500;font-size:clamp(5rem,20vw,9rem);line-height:.9;
  letter-spacing:.04em;color:var(--red)}
h1{font-family:"Jura",sans-serif;font-weight:500;font-size:clamp(1.5rem,5vw,2.1rem);
  letter-spacing:.03em;margin:18px 0 14px}
p{color:var(--muted);font-size:1rem;line-height:1.6;margin-bottom:32px}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;padding:15px 28px;border-radius:44px;
  font-family:"Jura",sans-serif;letter-spacing:.08em;font-size:.92rem;text-decoration:none;
  color:var(--white);border:1px solid var(--line);transition:.35s var(--ease)}
.btn:hover{border-color:rgba(224,18,43,.55);background:rgba(224,18,43,.08)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-red:hover{background:var(--red-deep);border-color:var(--red-deep)}
.logo{font-family:"Jura",sans-serif;letter-spacing:.32em;font-size:.72rem;color:var(--muted);
  text-transform:uppercase;margin-bottom:34px;display:block;text-decoration:none}
.logo b{color:var(--white);font-weight:500}
.logo i{color:var(--red);font-style:normal}
</style>
</head>
<body>
  <div class="box">
    <a class="logo" href="/"><b>Karma</b> <i>Omut</i> · Tattoo Collective</a>
    <div class="code">404</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка.<br>Загляните в работы или вернитесь на главную.</p>
    <div class="links">
      <a class="btn btn-red" href="/">На главную</a>
      <a class="btn" href="/works.html">Наши работы</a>
      <a class="btn" href="/training.html">Обучение</a>
    </div>
  </div>
</body>
</html>
